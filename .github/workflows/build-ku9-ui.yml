name: Build KU9 UI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Java64 debug
        run: ./gradlew assembleJava64Debug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-KU9-UI-java64-debug
          path: app/build/outputs/apk/java64/debug/*.apk
          if-no-files-found: error
